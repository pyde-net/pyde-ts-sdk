# Alerts on, scheduled bump PRs off.
#
# These were the only two repos in the org producing Dependabot
# version-update PRs — 10 of them open at once — because they were the
# only two with a dependabot.yml declaring updates. Everywhere else has
# no config and therefore no bump PRs at all.
#
# The PRs are not merely noise, they are unmergeable: remote CI is down
# on billing, so every one arrives ungated. Merging ungated is actively
# dangerous — the jsonwebtoken 9 to 10 bump in the explorer PANICS at
# first verify unless a crypto provider feature is selected, which only
# a local test run caught. A PR nothing can check is a liability.
#
# `open-pull-requests-limit: 0` disables version updates per ecosystem.
# Two things deliberately survive it:
#
#   * Dependabot ALERTS — a repo-level setting, untouched by this file.
#   * Dependabot SECURITY update PRs — the docs are explicit that these
#     "are not subject to this limit and do not count toward it".
#
# So we still hear about every vulnerability and still get a PR when one
# is actually fixable. We stop being paged about routine semver drift
# nothing can verify. Raise the limits again once CI is paying.

version: 2

updates:
  # npm — runtime + dev deps for the SDK itself.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "deps"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor + patch into one PR per ecosystem; major bumps get
    # their own PR each (semver-major can break consumers).
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # pyde-crypto-wasm is local-file linked until first published;
      # Dependabot can't update file: deps anyway.
      - dependency-name: "pyde-crypto-wasm"
      # Pin React major manually — peer-dep semantics for downstream
      # dapps mean any react@>=18 should keep working.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"

  # github-actions — the CI workflow itself.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    labels:
      - "deps"
      - "ci"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
